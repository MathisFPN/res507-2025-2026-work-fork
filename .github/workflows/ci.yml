name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: labs/40-containerized-node-app/app
        run: npm ci

      - name: Lint
        working-directory: labs/40-containerized-node-app/app
        run: npm run lint --if-present

      - name: Run tests
        working-directory: labs/40-containerized-node-app/app
        run: npm test

  build-and-verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: labs/40-containerized-node-app
        run: docker build -t quote-app -f docker/Dockerfile ./app

      - name: Run & Health Check
        run: |
          docker run -d --name quote-app -p 3000:3000 quote-app
          # Script de santé strict (Lane A)
          for i in $(seq 1 15); do
            if curl -s http://localhost:3000/health | grep -q "ok"; then
              echo "Healthy!"
              exit 0
            fi
            sleep 1
          done
          docker logs quote-app
          exit 1

  pr-security-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit dependencies
        working-directory: labs/40-containerized-node-app/app
        run: npm audit --audit-level=high